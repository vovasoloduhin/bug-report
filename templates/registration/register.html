{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-brand"><span class="dot"></span>Bugtracker</div>
  <form method="post" class="card auth-card form">
    <h1>Реєстрація</h1><p class="sub">Створіть акаунт, щоб долучитися до команди.</p>{% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {{ form.as_div }}
    <button class="btn block">Створити акаунт</button>
    <p class="muted small auth-alt">Вже є акаунт? <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Увійти</a></p>
  </form>
</div>
{% endblock %}
